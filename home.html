<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="icon.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        /* พื้นหลังเต็มจอทุกอัตราส่วน (position:fixed แยกเลเยอร์จากความสูงเนื้อหา) */
        .theme-bg { background-color: var(--theme-bg-color, #0a0414); position: relative; }
        .theme-bg::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-color: var(--theme-bg-color, #0a0414);
            background-image: var(--theme-bg-layer,
                linear-gradient(rgba(8, 4, 20, 0.55), rgba(8, 4, 20, 0.55)), url('bg-mystic.svg'));
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
        }
        .gold-text { color: #fde047; }
        .gold-gradient-text {
            background: var(--theme-gold-gradient, linear-gradient(to right, #fef08a, #fde047, #ca8a04));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-button {
            background: var(--theme-button-gradient, linear-gradient(to right, #ca8a04, #eab308, #ca8a04));
            color: var(--theme-button-text, #1a0b2e);
            font-weight: 700;
            transition: all 0.3s ease;
        }
        .gold-button:hover {
            background: linear-gradient(to right, #eab308, #fde047, #eab308);
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.4);
        }
        .mystic-card {
            background: var(--theme-card-bg, rgba(26, 11, 46, 0.85)) !important;
            border: 1px solid var(--theme-border-base, rgba(234, 179, 8, 0.3)) !important;
            border-radius: 2rem;
            position: relative;
        }
        .mystic-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            color: rgba(234, 179, 8, 0.6);
            font-size: 0.9rem;
            letter-spacing: 0.3em;
            margin: 0.25rem 0;
        }
        .mystic-divider::before, .mystic-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(234, 179, 8, 0.5), transparent);
        }
        .mystic-card::before {
            content: '✦';
            position: absolute;
            top: 10px; left: 14px;
            color: rgba(234, 179, 8, 0.5);
            font-size: 0.8rem;
        }
        .mystic-card::after {
            content: '✦';
            position: absolute;
            bottom: 10px; right: 14px;
            color: rgba(234, 179, 8, 0.5);
            font-size: 0.8rem;
        }
        
        /* ============ Theme color overrides (รองรับการเปลี่ยนสีตามธีม) ============ */
        .gold-text { color: var(--theme-accent-text, #fde047) !important; }
        .text-yellow-300 { color: var(--theme-accent-text, #fde047) !important; }
        .text-yellow-400 { color: var(--theme-accent-text-strong, #facc15) !important; }
        
        /* เปลี่ยนสีพื้นหลัง Navbar และ Dropdown ตามตัวแปรธีม */
        .bg-\[\#120521\] { background-color: var(--theme-card-bg, #120521) !important; }
        .bg-\[\#120521\]\/90 { background-color: color-mix(in srgb, var(--theme-card-bg, #120521) 90%, transparent) !important; }
        .bg-\[\#1a0b2e\] { background-color: var(--theme-input-bg, #1a0b2e) !important; }
        .bg-slate-900\/80 { background-color: color-mix(in srgb, var(--theme-alt-bg-deep, #0f172a) 80%, transparent) !important; }
        .bg-slate-950 { background-color: var(--theme-alt-bg-deep, #020617) !important; }
        .border-yellow-600\/30, .border-yellow-600\/35 { border-color: color-mix(in srgb, var(--theme-border-base, #ca8a04) 30%, transparent) !important; }
        .border-yellow-500\/50 { border-color: var(--theme-border-base, #eab308) !important; }
    </style>
</head>

        </div>

        <!-- Dropdown Menu มือถือ -->
        <div id="mobile-menu" class="hidden bg-[#120521] border-b border-yellow-600/30 px-4 py-4 space-y-2 shadow-2xl">

    <!-- ส่วนเนื้อหาหลัก -->
    <main class="flex-1 flex items-center justify-center p-4">
        <div class="max-w-md w-full mystic-card p-8 md:p-10 shadow-2xl space-y-5 text-center relative">
            <h1 class="text-2xl font-bold gold-gradient-text">กำลังปรับปรุง</h1>
            <div class="mystic-divider">✦</div>
            <a href="index.html" class="inline-block w-full py-3 border border-yellow-600/30 rounded-xl text-xs gold-text uppercase shadow-md hover:bg-yellow-600/10 transition">
                กลับสู่หน้าจองคิวดูดวง
            </a>
        </div>
    </main>

    <script>
        // ฟังก์ชันเปิด-ปิดเมนูมือถือ
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }

        // ดึงค่าธีมจากฐานข้อมูล Supabase อัตโนมัติเมื่อโหลดหน้าเว็บ
        window.addEventListener('DOMContentLoaded', async () => {
            if (window.supabase && typeof supabase.createClient === 'function' && typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_ANON_KEY !== 'undefined') {
                const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                const { data } = await client.from('settings').select('active_theme').eq('id', 1).single();
                if (data && window.applyWitchyuTheme) {
                    window.applyWitchyuTheme(data.active_theme);
                }
            }
        });
    </script>
