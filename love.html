<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <title>ทำนายดวงชะตา: ความรัก & ความสัมพันธ์</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .vangogh-card {
            background: radial-gradient(circle at 50% 30%, rgba(95, 30, 60, 0.9) 0%, rgba(35, 10, 25, 0.98) 70%, rgba(18, 5, 12, 1) 100%);
            border: 2px solid rgba(251, 113, 133, 0.6);
            box-shadow: 0 0 40px rgba(150, 30, 70, 0.4), inset 0 0 25px rgba(251, 113, 133, 0.2);
            position: relative;
            overflow: hidden;
        }
        .vangogh-card::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(ellipse at center, rgba(180, 70, 110, 0.15) 0%, transparent 60%),
                        repeating-radial-gradient(circle at 40% 40%, transparent, rgba(251, 113, 133, 0.05) 40px, transparent 80px);
            animation: swirlRotate 30s linear infinite;
            pointer-events: none;
        }
        @keyframes swirlRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .item-box {
            background: rgba(50, 15, 30, 0.7);
            border: 1px solid rgba(251, 113, 133, 0.4);
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .item-box:hover {
            background: rgba(80, 25, 50, 0.9);
            border-color: rgba(251, 113, 133, 1);
            box-shadow: 0 0 20px rgba(251, 113, 133, 0.4);
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 10px rgba(251, 113, 133, 0.9)); }
        }
        .sparkle-1 { animation: twinkle 4s infinite ease-in-out; }
    </style>
</head>
<body class="bg-black min-h-screen w-full m-0 p-4 text-gray-100 flex flex-col items-center justify-center relative bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-rose-950 via-slate-950 to-black">
    
    <div class="max-w-xl w-full mb-3 flex justify-between items-center px-2">
        <a href="lindex.html" class="text-xs bg-rose-950/60 hover:bg-rose-900 text-rose-200 px-3 py-1.5 rounded-lg border border-rose-400/40 transition">← กลับหน้าหลัก</a>
        <span class="text-xs text-rose-300 font-semibold"> ความรักและความสัมพันธ์</span>
    </div>
    
    <div id="app" class="max-w-xl w-full vangogh-card rounded-[2.5rem] p-6 md:p-8 text-center relative z-10">
        <div class="text-rose-300 text-lg mb-2 tracking-widest sparkle-1">✦ ✧ ☽️ ☾ ✧ ✦</div>

        <!-- Start Screen -->
        <div id="start-screen" class="py-4 relative z-10">
            <div class="text-4xl mb-4"></div>
            <h2 class="text-xl font-semibold text-rose-200 mb-2">พยากรณ์ความรัก & หัวใจ</h2>
            <p class="text-rose-200/80 mb-6 text-sm">อ่านกระแสความสัมพันธ์ คนคุย หรือเนื้อคู่</p>
            <button onclick="startQuiz()" class="bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-400 hover:to-pink-500 text-white font-bold py-3 px-8 rounded-full shadow-lg transition transform hover:scale-105">เริ่มทำนายความรัก</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden text-left relative z-10">
            <div class="flex justify-between items-center mb-4 border-b border-rose-900/50 pb-3">
                <span id="question-counter" class="text-xs font-semibold text-rose-300 bg-rose-950 px-3 py-1 rounded-full border border-rose-400/40">ข้อที่ 1 / 10</span>
                <div class="w-1/2 bg-gray-900 rounded-full h-2 overflow-hidden">
                    <div id="progress-bar" class="bg-rose-400 h-2 rounded-full transition-all duration-300" style="width: 10%"></div>
                </div>
            </div>
            <h3 id="question-text" class="text-base md:text-lg font-medium text-rose-100 mb-4 min-h-[50px] text-center"></h3>
            <div id="options-container" class="space-y-2.5 mb-6"></div>
            <div class="flex justify-between pt-3 border-t border-rose-900/50">
                <button id="prev-btn" onclick="prevQuestion()" class="hidden text-gray-300 text-sm font-medium px-4 py-2 rounded-lg border border-rose-900 transition bg-rose-950/50">ย้อนกลับ</button>
                <div class="ml-auto"><button id="next-btn" onclick="nextQuestion()" disabled class="bg-gray-800 text-gray-500 text-sm font-semibold py-2 px-6 rounded-lg cursor-not-allowed transition">ถัดไป</button></div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden text-center relative z-10">
            <div class="p-6 rounded-2xl bg-rose-950/60 border border-rose-400/40 mb-6 text-center shadow-lg">
                <div class="text-rose-300 text-sm mb-1 tracking-widest sparkle-1">✨ ── มหาสมุดแห่งโชคชะตา ── ✨</div>
                <h2 class="text-xl font-bold text-rose-200 mb-2">คำทำนายด้านความรักของคุณ</h2>
                <div id="result-badge" class="text-sm font-semibold text-rose-300 mb-3 bg-rose-900/80 inline-block px-4 py-1 rounded-full border border-rose-400/40"></div>
                <p id="result-description" class="text-gray-200 text-xs md:text-sm leading-relaxed mb-4 text-center bg-black/40 p-4 rounded-xl border border-rose-900/40"></p>
                <div class="text-[10px] text-rose-300/60 tracking-widest sparkle-1">✦ ── Starry Love Destiny ── ✦</div>
            </div>
            <div class="flex justify-center">
                <button onclick="restartQuiz()" class="bg-rose-900/60 hover:bg-rose-800 text-gray-200 text-sm font-semibold py-3 px-8 rounded-xl transition border border-rose-700">ทำนายใหม่อีกครั้ง</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            { q: "สถานะหัวใจและความสัมพันธ์ของคุณในปัจจุบันเป็นอย่างไร?", options: [{ text: "มีความรักที่ดี อบอุ่นและเข้าใจกัน", points: 3 }, { text: "มีงอนกันบ้างแต่เคลียร์กันได้", points: 2 }, { text: "โสดเหงา หรือมีความไม่แน่นอนสูง", points: 1 }] },
            { q: "การสื่อสารและความเข้าใจกันระหว่างคุณกับคนพิเศษเป็นเช่นไร?", options: [{ text: "พูดคุยกันทุกเรื่อง เปิดใจรับฟังกันดีมาก", points: 3 }, { text: "คุยกันตามเวลาว่าง ทั่วไปปกติ", points: 2 }, { text: "สื่อสารกันน้อยลง เริ่มมีระยะห่าง", points: 1 }] },
            { q: "ความรู้สึกไว้วางใจและความมั่นคงในความสัมพันธ์มีมากแค่ไหน?", options: [{ text: "มั่นใจและเชื่อใจกันร้อยเปอร์เซ็นต์", points: 3 }, { text: "มีความระแวงหรือกังวลเล็กน้อยตามประสา", points: 2 }, { text: "ไม่มั่นใจในความรู้สึกของอีกฝ่ายเลย", points: 1 }] },
            { q: "หากมีปัญหาหรือเรื่องกระทบกระทั่งกัน คุณมักจะจัดการอย่างไร?", options: [{ text: "หันหน้าคุยกันด้วยเหตุผลทันที", points: 3 }, { text: "ต่างคนต่างเว้นระยะให้อารมณ์เย็นแล้วค่อยคุย", points: 2 }, { text: "เงียบใส่กันหรือปล่อยปัญหาค้างคา", points: 1 }] },
            { q: "เสน่ห์และออร่าความรักของคุณในช่วงนี้ดึงดูดคนเข้ามาไหม?", options: [{ text: "มีคนเข้ามาสนใจหรือแสดงความรู้สึกดีๆ ด้วย", points: 3 }, { text: "เรื่อยๆ ใช้ชีวิตปกติ ยังไม่มีใครโดดเด่น", points: 2 }, { text: "ปิดกั้นตัวเอง ไม่อยากสนใจใคร", points: 1 }] },
            { q: "ความคาดหวังต่ออนาคตในความสัมพันธ์ของคุณตรงกันไหม?", options: [{ text: "มองภาพอนาคตและเป้าหมายเดียวกันชัดเจน", points: 3 }, { text: "ค่อยๆ เรียนรู้กันไปทีละวัน", points: 2 }, { text: "มีความเห็นหรือทิศทางชีวิตที่ต่างกันมาก", points: 1 }] },
            { q: "คุณรู้สึกอึดอัดหรือสูญเสียความเป็นตัวเองในความสัมพันธ์ไหม?", options: [{ text: "เป็นตัวของตัวเองได้อย่างเต็มที่และมีความสุข", points: 3 }, { text: "มีต้องปรับตัวเข้าหากันบ้าง", points: 2 }, { text: "รู้สึกอึดอัดและเหนื่อยล้ากับความสัมพันธ์", points: 1 }] },
            { q: "ความโรแมนติกและความใส่ใจในความสัมพันธ์ช่วงนี้เป็นอย่างไร?", options: [{ text: "มีเซอร์ไพรส์หรือความหวานเติมเต็มเรื่อยๆ", points: 3 }, { text: "เรื่อยๆ เรียบง่ายตามวิถีชีวิตประจำวัน", points: 2 }, { text: "จืดจางไร้ความหวานโรแมนติก", points: 1 }] },
            { q: "คุณคิดว่าความรักครั้งนี้จะนำพาการเติบโตมาสู่คุณหรือไม่?", options: [{ text: "ช่วยสนับสนุนและเติบโตไปด้วยกันอย่างดี", points: 3 }, { text: "ประคับประคองกันไปได้เรื่อยๆ", points: 2 }, { text: "รู้สึกบั่นทอนจิตใจและพลังงานชีวิต", points: 1 }] },
            { q: "ภาพรวมดวงความรักของคุณในอีกไม่กี่เดือนข้างหน้าจะเป็นอย่างไร?", options: [{ text: "สมหวัง มีข่าวดี หรือความสัมพันธ์แน่นแฟ้นขึ้น", points: 3 }, { text: "ความสัมพันธ์ดำเนินไปอย่างมั่นคงสม่ำเสมอ", points: 2 }, { text: "ต้องใช้ความอดทนและเวลาทบทวนตัวเองสูง", points: 1 }] }
        ];
        let currentQuestion = 0; let userAnswers = new Array(questions.length).fill(null);
        function startQuiz() { document.getElementById('start-screen').classList.add('hidden'); document.getElementById('quiz-screen').classList.remove('hidden'); loadQuestion(); }
        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question-text').textContent = `${currentQuestion + 1}. ${q.q}`;
            document.getElementById('question-counter').textContent = `ข้อที่ ${currentQuestion + 1} / ${questions.length}`;
            document.getElementById('progress-bar').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
            const container = document.getElementById('options-container'); container.innerHTML = '';
            q.options.forEach((opt, index) => {
                const isSelected = userAnswers[currentQuestion] === index;
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border transition flex items-center justify-between text-sm item-box ${isSelected ? 'border-rose-400 bg-rose-900/80 text-rose-200 font-medium' : 'text-gray-200'}`;
                btn.innerHTML = `<span>${opt.text}</span><span class="w-5 h-5 rounded-full border flex items-center justify-center text-xs ${isSelected ? 'border-rose-300 bg-rose-500 text-white font-bold' : 'border-gray-600'}">${isSelected ? '✓' : ''}</span>`;
                btn.onclick = () => { userAnswers[currentQuestion] = index; loadQuestion(); };
                container.appendChild(btn);
            });
            document.getElementById('prev-btn').classList.toggle('hidden', currentQuestion === 0);
            const nextBtn = document.getElementById('next-btn');
            if (userAnswers[currentQuestion] !== null) {
                nextBtn.disabled = false; nextBtn.className = "bg-rose-500 hover:bg-rose-400 text-white text-sm font-bold py-2 px-6 rounded-lg shadow transition";
                nextBtn.textContent = currentQuestion === questions.length - 1 ? "เปิดคำทำนาย" : "ถัดไป";
            } else {
                nextBtn.disabled = true; nextBtn.className = "bg-gray-800 text-gray-500 text-sm font-semibold py-2 px-6 rounded-lg cursor-not-allowed transition";
            }
        }
        function nextQuestion() { if (currentQuestion < questions.length - 1) { currentQuestion++; loadQuestion(); } else { showResult(); } }
        function prevQuestion() { if (currentQuestion > 0) { currentQuestion--; loadQuestion(); } }
        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden'); document.getElementById('result-screen').classList.remove('hidden');
            const totalScore = userAnswers.reduce((sum, ansIdx, qIdx) => sum + (ansIdx !== null ? questions[qIdx].options[ansIdx].points : 0), 0);
            let title = totalScore >= 25 ? "💖 ความรักหวานชื่น สมหวัง พลังหัวใจเปี่ยมสุข" : totalScore >= 18 ? "🌹 ความรักความสัมพันธ์มั่นคงอบอุ่น" : "⚠️ ช่วงทบทวนความรู้สึกและเยียวยาหัวใจ";
            let desc = totalScore >= 25 ? "ดวงความรักโดดเด่นมาก คนมีคู่ความสัมพันธ์แน่นแฟ้น คนโสดมีเกณฑ์เจอคนถูกใจเข้ามาเติมเต็ม" : totalScore >= 18 ? "ความรักดำเนินไปอย่างราบรื่นเข้าใจกันดี หมั่นเติมความหวานให้กันสม่ำเสมอ" : "ช่วงนี้อาจมีความไม่เข้าใจหรือความเหนื่อยล้าในความสัมพันธ์ ควรใช้เวลาพูดคุยและทบทวนความรู้สึกกัน";
            document.getElementById('result-badge').textContent = title; document.getElementById('result-description').innerHTML = desc;
        }
        function restartQuiz() { currentQuestion = 0; userAnswers = new Array(questions.length).fill(null); document.getElementById('result-screen').classList.add('hidden'); document.getElementById('start-screen').classList.remove('hidden'); }
    </script>
</body>
</html>
