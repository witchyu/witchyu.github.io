<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <title>ทำนายดวงชะตา: โชคลาภ & วาสนา</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .vangogh-card {
            background: radial-gradient(circle at 50% 30%, rgba(85, 30, 110, 0.9) 0%, rgba(25, 10, 45, 0.98) 70%, rgba(12, 4, 22, 1) 100%);
            border: 2px solid rgba(234, 198, 92, 0.6);
            box-shadow: 0 0 40px rgba(100, 30, 150, 0.5), inset 0 0 25px rgba(234, 198, 92, 0.2);
            position: relative;
            overflow: hidden;
        }
        .vangogh-card::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(ellipse at center, rgba(120, 70, 180, 0.15) 0%, transparent 60%),
                        repeating-radial-gradient(circle at 40% 40%, transparent, rgba(234, 198, 92, 0.05) 40px, transparent 80px);
            animation: swirlRotate 30s linear infinite;
            pointer-events: none;
        }
        @keyframes swirlRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .item-box {
            background: rgba(40, 15, 60, 0.7);
            border: 1px solid rgba(234, 198, 92, 0.4);
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .item-box:hover {
            background: rgba(70, 25, 100, 0.9);
            border-color: rgba(234, 198, 92, 1);
            box-shadow: 0 0 20px rgba(234, 198, 92, 0.4);
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 10px rgba(234, 198, 92, 0.9)); }
        }
        .sparkle-1 { animation: twinkle 4s infinite ease-in-out; }
    </style>
</head>
<body class="bg-black min-h-screen w-full m-0 p-4 text-gray-100 flex flex-col items-center justify-center relative bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-purple-950 via-slate-950 to-black">
    
    <div class="max-w-xl w-full mb-3 flex justify-between items-center px-2">
        <a href="lindex.html" class="text-xs bg-purple-950/60 hover:bg-purple-900 text-purple-200 px-3 py-1.5 rounded-lg border border-purple-400/40 transition">← กลับหน้าหลัก</a>
        <span class="text-xs text-amber-300 font-semibold">โชคลาภและวาสนา</span>
    </div>
    
    <div id="app" class="max-w-xl w-full vangogh-card rounded-[2.5rem] p-6 md:p-8 text-center relative z-10">
        <div class="text-amber-300 text-lg mb-2 tracking-widest sparkle-1">✦ ✧ ☽ ☾ ✧ ✦</div>

        <!-- Start Screen -->
        <div id="start-screen" class="py-4 relative z-10">
            <div class="text-4xl mb-4"></div>
            <h2 class="text-xl font-semibold text-amber-200 mb-2">พยากรณ์โชคลาภ & วาสนา</h2>
            <p class="text-purple-200/80 mb-6 text-sm">เสี่ยงทายดวงดาว ลางสังหรณ์ และโชคลาภ</p>
            <button onclick="startQuiz()" class="bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-gray-950 font-bold py-3 px-8 rounded-full shadow-lg transition transform hover:scale-105">เริ่มเสี่ยงทายโชคลาภ</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden text-left relative z-10">
            <div class="flex justify-between items-center mb-4 border-b border-purple-900/50 pb-3">
                <span id="question-counter" class="text-xs font-semibold text-amber-300 bg-purple-950 px-3 py-1 rounded-full border border-amber-400/40">ข้อที่ 1 / 10</span>
                <div class="w-1/2 bg-gray-900 rounded-full h-2 overflow-hidden">
                    <div id="progress-bar" class="bg-amber-400 h-2 rounded-full transition-all duration-300" style="width: 10%"></div>
                </div>
            </div>
            <h3 id="question-text" class="text-base md:text-lg font-medium text-amber-100 mb-4 min-h-[50px] text-center"></h3>
            <div id="options-container" class="space-y-2.5 mb-6"></div>
            <div class="flex justify-between pt-3 border-t border-purple-900/50">
                <button id="prev-btn" onclick="prevQuestion()" class="hidden text-gray-300 text-sm font-medium px-4 py-2 rounded-lg border border-purple-900 transition bg-purple-950/50">ย้อนกลับ</button>
                <div class="ml-auto"><button id="next-btn" onclick="nextQuestion()" disabled class="bg-gray-800 text-gray-500 text-sm font-semibold py-2 px-6 rounded-lg cursor-not-allowed transition">ถัดไป</button></div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden text-center relative z-10">
            <div class="p-6 rounded-2xl bg-purple-950/60 border border-amber-400/40 mb-6 text-center shadow-lg">
                <div class="text-amber-300 text-sm mb-1 tracking-widest sparkle-1">✨ ── มหาสมุดแห่งโชคชะตา ── ✨</div>
                <h2 class="text-xl font-bold text-amber-200 mb-2">คำทำนายด้านโชคลาภวาสนา</h2>
                <div id="result-badge" class="text-sm font-semibold text-amber-300 mb-3 bg-purple-900/80 inline-block px-4 py-1 rounded-full border border-amber-400/40"></div>
                <p id="result-description" class="text-gray-200 text-xs md:text-sm leading-relaxed mb-4 text-center bg-black/40 p-4 rounded-xl border border-purple-900/40"></p>
                <div class="text-[10px] text-amber-300/60 tracking-widest sparkle-1">✦ ── Starry Luck Destiny ── ✦</div>
            </div>
            <div class="flex justify-center">
                <button onclick="restartQuiz()" class="bg-purple-900/60 hover:bg-purple-800 text-gray-200 text-sm font-semibold py-3 px-8 rounded-xl transition border border-purple-700">ทำนายใหม่อีกครั้ง</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            { q: "ลางสังหรณ์หรือความรู้สึกบอกเหตุในช่วงนี้มีความแม่นยำแค่ไหน?", options: [{ text: "แม่นยำมาก ฝันหรือสังหรณ์อะไรมักเป็นจริง", points: 3 }, { text: "มีรู้สึกบ้างเป็นบางครั้งคราว", points: 2 }, { text: "ไม่ค่อยมีความรู้สึกพิเศษเรื่องนี้", points: 1 }] },
            { q: "คุณมีความเชื่อเรื่องสิ่งศักดิ์สิทธิ์หรือการขอพรโชคลาภมากน้อยเพียงใด?", options: [{ text: "ศรัทธาและมักได้ผลลัพธ์ที่น่าทึ่งเสมอ", points: 3 }, { text: "เคารพและทำบุญตามโอกาส", points: 2 }, { text: "เน้นพึ่งพาตนเองเป็นหลัก", points: 1 }] },
            { q: "ความฝันยามค่ำคืนของคุณในช่วงนี้มีตัวเลขหรือลางบอกเหตุเด่นชัดไหม?", options: [{ text: "มีความฝันแปลกๆ หรือฝันเห็นสิ่งมงคลชัดเจน", points: 3 }, { text: "ฝันทั่วไปจำรายละเอียดไม่ค่อยได้", points: 2 }, { text: "นอนหลับลึกจนไม่ฝันเลย", points: 1 }] },
            { q: "ดวงการเสี่ยงโชคหรือลาภลอยในช่วงนี้ของคุณรู้สึกอย่างไร?", options: [{ text: "รู้สึกมีดวงเฮง มีเกณฑ์รับโชคเล็กๆ น้อยๆ", points: 3 }, { text: "กลางๆ ได้มาตามความเหมาะสม", points: 1 }, { text: "ไม่ค่อยมีดวงทางนี้ เน้นน้ำพักน้ำแรง", points: 1 }] },
            { q: "บังเอิญเจอเลขมงคลหรือเหตุการณ์ซ้ำๆ บ่อยแค่ไหน?", options: [{ text: "เจอตัวเลขเดิมหรือสัญญาณแปลกๆ บ่อยมาก", points: 3 }, { text: "มีผ่านตาบ้างบางครั้ง", points: 2 }, { text: "ไม่เคยสังเกตเลย", points: 1 }] },
            { q: "การทำบุญสร้างกุศลหรือการช่วยเหลือผู้อื่นของคุณในช่วงนี้?", options: [{ text: "ทำสม่ำเสมอและรู้สึกถึงพลังงานบุญกุศล", points: 3 }, { text: "ทำตามโอกาสและกำลังทรัพย์", points: 2 }, { text: "นานๆ ครั้งตามความสะดวก", points: 1 }] },
            { q: "คุณรู้สึกว่าช่วงนี้ชีวิตมี 'ปาฏิหาริย์' หรือความบังเอิญดีๆ เกิดขึ้นบ้างไหม?", options: [{ text: "มีเรื่องเหลือเชื่อและโชคดีเข้ามาบ่อย", points: 3 }, { text: "มีราบรื่นบ้างตามสถานการณ์", points: 2 }, { text: "ทุกอย่างเป็นไปตามตรรกะปกติ", points: 1 }] },
            { q: "พลังงานรอบตัวคุณตอนนี้เหมาะกับการเริ่มต้นเสี่ยงโชคหรือลุ้นรับทรัพย์ไหม?", options: [{ text: "พลังงานเปิดรับ โชคชะตาเข้าข้าง", points: 3 }, { text: "พอมีลุ้นเล็กๆ น้อยๆ พอเป็นสีสัน", points: 2 }, { text: "ควรงดเว้นและตั้งหน้าตั้งตาทำงานดีกว่า", points: 1 }] },
            { q: "เครื่องรางของขลังหรือวัตถุมงคลที่คุณบูชามีความเชื่อมโยงกับคุณไหม?", options: [{ text: "รู้สึกถึงพลังงานคุ้มครองและโชคลาภเด่นชัด", points: 3 }, { text: "มีพกติดตัวเพื่อความสบายใจ", points: 2 }, { text: "ไม่ได้บูชาหรือพกสิ่งใดเลย", points: 1 }] },
            { q: "ภาพรวมวาสนาและโชคชะตาของคุณในรอบเดือนนี้มองเห็นอะไร?", options: [{ text: "ดวงชะตาขาขึ้น มีเกณฑ์รับโชคก้อนโต", points: 3 }, { text: "ความสุขสงบและโชคลาภตามอัตภาพ", points: 2 }, { text: "ต้องอาศัยความเพียรพยายามเป็นหลัก", points: 1 }] }
        ];
        let currentQuestion = 0; let userAnswers = new Array(questions.length).fill(null);
        function startQuiz() { document.getElementById('start-screen').classList.add('hidden'); document.getElementById('quiz-screen').classList.remove('hidden'); loadQuestion(); }
        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question-text').textContent = `${currentQuestion + 1}. ${q.q}`;
            document.getElementById('question-counter').textContent = `ข้อที่ ${currentQuestion + 1} / ${questions.length}`;
            document.getElementById('progress-bar').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
            const container = document.getElementById('options-container'); container.innerHTML = '';
            q.options.forEach((opt, index) => {
                const isSelected = userAnswers[currentQuestion] === index;
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border transition flex items-center justify-between text-sm item-box ${isSelected ? 'border-amber-400 bg-purple-900/80 text-amber-200 font-medium' : 'text-gray-200'}`;
                btn.innerHTML = `<span>${opt.text}</span><span class="w-5 h-5 rounded-full border flex items-center justify-center text-xs ${isSelected ? 'border-amber-300 bg-amber-500 text-gray-950 font-bold' : 'border-gray-600'}">${isSelected ? '✓' : ''}</span>`;
                btn.onclick = () => { userAnswers[currentQuestion] = index; loadQuestion(); };
                container.appendChild(btn);
            });
            document.getElementById('prev-btn').classList.toggle('hidden', currentQuestion === 0);
            const nextBtn = document.getElementById('next-btn');
            if (userAnswers[currentQuestion] !== null) {
                nextBtn.disabled = false; nextBtn.className = "bg-amber-500 hover:bg-amber-400 text-gray-950 text-sm font-bold py-2 px-6 rounded-lg shadow transition";
                nextBtn.textContent = currentQuestion === questions.length - 1 ? "เปิดคำทำนาย" : "ถัดไป";
            } else {
                nextBtn.disabled = true; nextBtn.className = "bg-gray-800 text-gray-500 text-sm font-semibold py-2 px-6 rounded-lg cursor-not-allowed transition";
            }
        }
        function nextQuestion() { if (currentQuestion < questions.length - 1) { currentQuestion++; loadQuestion(); } else { showResult(); } }
        function prevQuestion() { if (currentQuestion > 0) { currentQuestion--; loadQuestion(); } }
        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden'); document.getElementById('result-screen').classList.remove('hidden');
            const totalScore = userAnswers.reduce((sum, ansIdx, qIdx) => sum + (ansIdx !== null ? questions[qIdx].options[ansIdx].points : 0), 0);
            let title = totalScore >= 25 ? "🌟 ผู้มีบุญญาธิการ ดวงโชคลาภพุ่งสูงสุดขีด" : totalScore >= 18 ? "🌙 ดวงวาสนาปานกลาง มีโชคตามสมควร" : "🕯️ ช่วงเวลาแห่งการสะสมบุญสร้างกุศล";
            let desc = totalScore >= 25 ? "ดวงโชคลาภโดดเด่นมาก มีเกณฑ์ได้รับลาภลอยหรือข่าวดีเรื่องโชคชะตาอย่างไม่คาดฝัน" : totalScore >= 18 ? "ดวงชะตาสมดุล มีโชคลาภเข้ามาตามอัตภาพและความเพียรพยายาม" : "ควรงดเว้นการเสี่ยงโชค หันมาเน้นการสร้างบุญกุศลและการทำงานสร้างอนาคต";
            document.getElementById('result-badge').textContent = title; document.getElementById('result-description').innerHTML = desc;
        }
        function restartQuiz() { currentQuestion = 0; userAnswers = new Array(questions.length).fill(null); document.getElementById('result-screen').classList.add('hidden'); document.getElementById('start-screen').classList.remove('hidden'); }
    </script>
</body>
</html>
