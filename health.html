<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <title>ทำนายดวงชะตา: สุขภาพ & พลังงาน</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .vangogh-card {
            background: radial-gradient(circle at 50% 30%, rgba(20, 75, 50, 0.9) 0%, rgba(8, 30, 20, 0.98) 70%, rgba(4, 15, 10, 1) 100%);
            border: 2px solid rgba(110, 231, 183, 0.6);
            box-shadow: 0 0 40px rgba(16, 120, 80, 0.4), inset 0 0 25px rgba(110, 231, 183, 0.2);
            position: relative;
            overflow: hidden;
        }
        .vangogh-card::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(ellipse at center, rgba(80, 180, 130, 0.15) 0%, transparent 60%),
                        repeating-radial-gradient(circle at 40% 40%, transparent, rgba(110, 231, 183, 0.05) 40px, transparent 80px);
            animation: swirlRotate 30s linear infinite;
            pointer-events: none;
        }
        @keyframes swirlRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .item-box {
            background: rgba(10, 45, 30, 0.7);
            border: 1px solid rgba(110, 231, 183, 0.4);
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .item-box:hover {
            background: rgba(20, 70, 45, 0.9);
            border-color: rgba(110, 231, 183, 1);
            box-shadow: 0 0 20px rgba(110, 231, 183, 0.4);
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 10px rgba(110, 231, 183, 0.9)); }
        }
        .sparkle-1 { animation: twinkle 4s infinite ease-in-out; }
    </style>
</head>
<body class="bg-black min-h-screen w-full m-0 p-4 text-gray-100 flex flex-col items-center justify-center relative bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-emerald-950 via-slate-950 to-black">
    
    <div class="max-w-xl w-full mb-3 flex justify-between items-center px-2">
        <a href="lindex.html" class="text-xs bg-emerald-950/60 hover:bg-emerald-900 text-emerald-200 px-3 py-1.5 rounded-lg border border-emerald-400/40 transition">← กลับหน้าหลัก</a>
        <span class="text-xs text-emerald-300 font-semibold">สุขภาพและพลังชีวิต</span>
    </div>
    
    <div id="app" class="max-w-xl w-full vangogh-card rounded-[2.5rem] p-6 md:p-8 text-center relative z-10">
        <div class="text-emerald-300 text-lg mb-2 tracking-widest sparkle-1">✦ ✧ ☽  ☾ ✧ ✦</div>

        <!-- Start Screen -->
        <div id="start-screen" class="py-4 relative z-10">
            <div class="text-4xl mb-4"></div>
            <h2 class="text-xl font-semibold text-emerald-200 mb-2">พยากรณ์พลังสุขภาพ</h2>
            <p class="text-emerald-200/80 mb-6 text-sm">ตรวจเช็กสมดุลกาย จิตใจ และพลังงานชีวิต</p>
            <button onclick="startQuiz()" class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-gray-950 font-bold py-3 px-8 rounded-full shadow-lg transition transform hover:scale-105">เริ่มทำนายสุขภาพ</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden text-left relative z-10">
            <div class="flex justify-between items-center mb-4 border-b border-emerald-900/50 pb-3">
                <span id="question-counter" class="text-xs font-semibold text-emerald-300 bg-emerald-950 px-3 py-1 rounded-full border border-emerald-400/40">ข้อที่ 1 / 10</span>
                <div class="w-1/2 bg-gray-900 rounded-full h-2 overflow-hidden">
                    <div id="progress-bar" class="bg-emerald-400 h-2 rounded-full transition-all duration-300" style="width: 10%"></div>
                </div>
            </div>
            <h3 id="question-text" class="text-base md:text-lg font-medium text-emerald-100 mb-4 min-h-[50px] text-center"></h3>
            <div id="options-container" class="space-y-2.5 mb-6"></div>
            <div class="flex justify-between pt-3 border-t border-emerald-900/50">
                <button id="prev-btn" onclick="prevQuestion()" class="hidden text-gray-300 text-sm font-medium px-4 py-2 rounded-lg border border-emerald-900 transition bg-emerald-950/50">ย้อนกลับ</button>
                <div class="ml-auto"><button id="next-btn" onclick="nextQuestion()" disabled class="bg-gray-800 text-gray-500 text-sm font-semibold py-2 px-6 rounded-lg cursor-not-allowed transition">ถัดไป</button></div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden text-center relative z-10">
            <div class="p-6 rounded-2xl bg-emerald-950/60 border border-emerald-400/40 mb-6 text-center shadow-lg">
                <div class="text-emerald-300 text-sm mb-1 tracking-widest sparkle-1">✨ ── มหาสมุดแห่งโชคชะตา ── ✨</div>
                <h2 class="text-xl font-bold text-emerald-200 mb-2">คำทำนายด้านสุขภาพของคุณ</h2>
                <div id="result-badge" class="text-sm font-semibold text-emerald-300 mb-3 bg-emerald-900/80 inline-block px-4 py-1 rounded-full border border-emerald-400/40"></div>
                <p id="result-description" class="text-gray-200 text-xs md:text-sm leading-relaxed mb-4 text-center bg-black/40 p-4 rounded-xl border border-emerald-900/40"></p>
                <div class="text-[10px] text-emerald-300/60 tracking-widest sparkle-1">✦ ── Starry Health Destiny ── ✦</div>
            </div>
            <div class="flex justify-center">
                <button onclick="restartQuiz()" class="bg-emerald-900/60 hover:bg-emerald-800 text-gray-200 text-sm font-semibold py-3 px-8 rounded-xl transition border border-emerald-700">ทำนายใหม่อีกครั้ง</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            { q: "คุณภาพการนอนหลับของคุณในช่วงนี้เป็นอย่างไร?", options: [{ text: "หลับสนิทตื่นมาสดชื่นเต็มอิ่ม", points: 3 }, { text: "หลับๆ ตื่นๆ บ้างตามความเครียด", points: 2 }, { text: "นอนไม่ค่อยหลับ พักผ่อนไม่เพียงพอ", points: 1 }] },
            { q: "ระดับพลังงานและความกระฉับกระเฉงในแต่ละวันของคุณ?", options: [{ text: "พลังงานล้นเหลือ ทำกิจกรรมได้ตลอดวัน", points: 3 }, { text: "มีเหนื่อยบ้างช่วงบ่ายแต่พอไหว", points: 2 }, { text: "อ่อนเพลีย ไร้เรี่ยวแรงตั้งแต่เช้า", points: 1 }] },
            { q: "คุณรู้สึกมีความเครียดสะสมทางจิตใจมากแค่ไหนในตอนนี้?", options: [{ text: "จิตใจสงบ ผ่อนคลาย ไร้ความกังวล", points: 3 }, { text: "มีเครียดประปรายตามสถานการณ์", points: 2 }, { text: "เครียดสะสม วิตกกังวลบ่อย", points: 1 }] },
            { q: "พฤติกรรมการรับประทานอาหารของคุณในช่วงนี้เป็นอย่างไร?", options: [{ text: "ทานอาหารมีประโยชน์ตรงเวลาครบ 5 หมู่", points: 3 }, { text: "ทานตามความสะดวก มีหลุดบ้าง", points: 2 }, { text: "ทานไม่เป็นเวลา ทานอาหารฟาสต์ฟู้ดบ่อย", points: 1 }] },
            { q: "คุณได้ออกกำลังกายหรือขยับร่างกายเพื่อสุขภาพบ้างไหม?", options: [{ text: "ออกกำลังกายสม่ำเสมอเป็นประจำ", points: 3 }, { text: "มีขยับตัวหรือเดินบ้างตามโอกาส", points: 2 }, { text: "แทบไม่ได้ออกกำลังกายเลย นั่งติดที่", points: 1 }] },
            { q: "อาการปวดเมื่อยตามร่างกาย (เช่น คอ บ่า ไหล่ หลัง) รบกวนคุณไหม?", options: [{ text: "ร่างกายยืดหยุ่นสบาย ไม่มีอาการปวด", points: 3 }, { text: "มีเมื่อยล้าบ้างตามอาการนั่งทำงาน", points: 2 }, { text: "ปวดเรื้อรังจนรบกวนการใช้ชีวิต", points: 1 }] },
            { q: "สุขภาพจิตใจและความสุขในแต่ละวันของคุณเป็นอย่างไร?", options: [{ text: "มีความสุข จิตใจเบิกบานมองโลกในแง่ดี", points: 3 }, { text: "ทรงตัว มีสุขบ้างเบื่อหน่ายบ้าง", points: 2 }, { text: "รู้สึกหดหู่ ซึมเซา หรือหมดพลังใจ", points: 1 }] },
            { q: "คุณดื่มน้ำเปล่าและดูแลความชุ่มชื้นให้ร่างกายเพียงพอไหม?", options: [{ text: "ดื่มน้ำสะอาดครบตามปริมาณที่ร่างกายต้องการ", points: 3 }, { text: "ดื่มพอประมาณแต่น้อยไปนิด", points: 2 }, { text: "ดื่มน้ำน้อยมาก หันไปติดเครื่องดื่มหวานๆ", points: 1 }] },
            { q: "ระบบภูมิคุ้มกันของคุณในช่วงนี้เป็นอย่างไร (เช่น เป็นหวัดง่ายไหม)?", options: [{ text: "แข็งแรงดี ไม่ค่อยเจ็บป่วย", points: 3 }, { text: "มีป่วยเล็กๆ น้อยๆ ตามอากาศ", points: 2 }, { text: "เจ็บป่วยง่าย ภูมิคุ้มกันต่ำ", points: 1 }] },
            { q: "ความตั้งใจในการดูแลสุขภาพตัวเองในอนาคตอันใกล้นี้?", options: [{ text: "ตั้งใจดูแลตัวเองให้ดียิ่งขึ้นไปอีก", points: 3 }, { text: "อยากปรับเปลี่ยนพฤติกรรมบางอย่าง", points: 2 }, { text: "ยังไม่มีเวลาดูแลตัวเองเป็นพิเศษ", points: 1 }] }
        ];
        let currentQuestion = 0; let userAnswers = new Array(questions.length).fill(null);
        function startQuiz() { document.getElementById('start-screen').classList.add('hidden'); document.getElementById('quiz-screen').classList.remove('hidden'); loadQuestion(); }
        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question-text').textContent = `${currentQuestion + 1}. ${q.q}`;
            document.getElementById('question-counter').textContent = `ข้อที่ ${currentQuestion + 1} / ${questions.length}`;
            document.getElementById('progress-bar').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
            const container = document.getElementById('options-container'); container.innerHTML = '';
            q.options.forEach((opt, index) => {
                const isSelected = userAnswers[currentQuestion] === index;
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border transition flex items-center justify-between text-sm item-box ${isSelected ? 'border-emerald-400 bg-emerald-900/80 text-emerald-200 font-medium' : 'text-gray-200'}`;
                btn.innerHTML = `<span>${opt.text}</span><span class="w-5 h-5 rounded-full border flex items-center justify-center text-xs ${isSelected ? 'border-emerald-300 bg-emerald-500 text-gray-950 font-bold' : 'border-gray-600'}">${isSelected ? '✓' : ''}</span>`;
                btn.onclick = () => { userAnswers[currentQuestion] = index; loadQuestion(); };
                container.appendChild(btn);
            });
            document.getElementById('prev-btn').classList.toggle('hidden', currentQuestion === 0);
            const nextBtn = document.getElementById('next-btn');
            if (userAnswers[currentQuestion] !== null) {
                nextBtn.disabled = false; nextBtn.className = "bg-emerald-500 hover:bg-emerald-400 text-gray-950 text-sm font-bold py-2 px-6 rounded-lg shadow transition";
                nextBtn.textContent = currentQuestion === questions.length - 1 ? "เปิดคำทำนาย" : "ถัดไป";
            } else {
                nextBtn.disabled = true; nextBtn.className = "bg-gray-800 text-gray-500 text-sm font-semibold py-2 px-6 rounded-lg cursor-not-allowed transition";
            }
        }
        function nextQuestion() { if (currentQuestion < questions.length - 1) { currentQuestion++; loadQuestion(); } else { showResult(); } }
        function prevQuestion() { if (currentQuestion > 0) { currentQuestion--; loadQuestion(); } }
        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden'); document.getElementById('result-screen').classList.remove('hidden');
            const totalScore = userAnswers.reduce((sum, ansIdx, qIdx) => sum + (ansIdx !== null ? questions[qIdx].options[ansIdx].points : 0), 0);
            let title = totalScore >= 25 ? "🌱 พลังชีวิตเปี่ยมล้น ร่างกายแข็งแรงสมบูรณ์" : totalScore >= 18 ? "🍃 สุขภาพกายใจสมดุลปานกลาง" : "⚠️ ช่วงต้องการการพักผ่อนและฟื้นฟูร่างกาย";
            let desc = totalScore >= 25 ? "สุขภาพกายและใจอยู่ในเกณฑ์ดีเยี่ยม พลังงานชีวิตสูง ปฏิบัติกิจวัตรได้อย่างสดชื่น" : totalScore >= 18 ? "สุขภาพทั่วไปปกติ หมั่นดูแลพักผ่อนให้เพียงพอและออกกำลังกายต่อเนื่อง" : "ร่างกายส่งสัญญาณเตือนว่าควรพักผ่อนให้มากขึ้น จัดสรรเวลาดูแลสุขภาพด่วน";
            document.getElementById('result-badge').textContent = title; document.getElementById('result-description').innerHTML = desc;
        }
        function restartQuiz() { currentQuestion = 0; userAnswers = new Array(questions.length).fill(null); document.getElementById('result-screen').classList.add('hidden'); document.getElementById('start-screen').classList.remove('hidden'); }
    </script>
</body>
</html>
