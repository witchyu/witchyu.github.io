<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <title>ทำนายดวงชะตา: การเงิน & ทรัพย์สิน</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .vangogh-card {
            background: radial-gradient(circle at 50% 30%, rgba(110, 85, 20, 0.9) 0%, rgba(40, 30, 10, 0.98) 70%, rgba(20, 15, 5, 1) 100%);
            border: 2px solid rgba(253, 224, 71, 0.6);
            box-shadow: 0 0 40px rgba(200, 150, 30, 0.4), inset 0 0 25px rgba(253, 224, 71, 0.2);
            position: relative;
            overflow: hidden;
        }
        .vangogh-card::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(ellipse at center, rgba(220, 180, 60, 0.15) 0%, transparent 60%),
                        repeating-radial-gradient(circle at 40% 40%, transparent, rgba(253, 224, 71, 0.05) 40px, transparent 80px);
            animation: swirlRotate 30s linear infinite;
            pointer-events: none;
        }
        @keyframes swirlRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .item-box {
            background: rgba(50, 40, 12, 0.7);
            border: 1px solid rgba(253, 224, 71, 0.4);
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .item-box:hover {
            background: rgba(80, 65, 20, 0.9);
            border-color: rgba(253, 224, 71, 1);
            box-shadow: 0 0 20px rgba(253, 224, 71, 0.4);
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 10px rgba(253, 224, 71, 0.9)); }
        }
        .sparkle-1 { animation: twinkle 4s infinite ease-in-out; }
    </style>
</head>
<body class="bg-black min-h-screen w-full m-0 p-4 text-gray-100 flex flex-col items-center justify-center relative bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-amber-950 via-slate-950 to-black">
    
    <div class="max-w-xl w-full mb-3 flex justify-between items-center px-2">
        <a href="lindex.html" class="text-xs bg-amber-950/60 hover:bg-amber-900 text-amber-200 px-3 py-1.5 rounded-lg border border-amber-400/40 transition">← กลับหน้าหลัก</a>
        <span class="text-xs text-amber-300 font-semibold">การเงินและความมั่งคั่ง</span>
    </div>
    
    <div id="app" class="max-w-xl w-full vangogh-card rounded-[2.5rem] p-6 md:p-8 text-center relative z-10">
        <div class="text-amber-300 text-lg mb-2 tracking-widest sparkle-1">✦ ✧ ☽ ☾ ✧ ✦</div>

        <!-- Start Screen -->
        <div id="start-screen" class="py-4 relative z-10">
            <div class="text-4xl mb-4"></div>
            <h2 class="text-xl font-semibold text-amber-200 mb-2">พยากรณ์กระแสการเงิน</h2>
            <p class="text-amber-200/80 mb-6 text-sm">เจาะลึกกระแสทรัพย์สิน โชคลาภ และการบริหารเงิน</p>
            <button onclick="startQuiz()" class="bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-gray-950 font-bold py-3 px-8 rounded-full shadow-lg transition transform hover:scale-105">เริ่มทำนายการเงิน</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden text-left relative z-10">
            <div class="flex justify-between items-center mb-4 border-b border-amber-900/50 pb-3">
                <span id="question-counter" class="text-xs font-semibold text-amber-300 bg-amber-950 px-3 py-1 rounded-full border border-amber-400/40">ข้อที่ 1 / 10</span>
                <div class="w-1/2 bg-gray-900 rounded-full h-2 overflow-hidden">
                    <div id="progress-bar" class="bg-amber-400 h-2 rounded-full transition-all duration-300" style="width: 10%"></div>
                </div>
            </div>
            <h3 id="question-text" class="text-base md:text-lg font-medium text-amber-100 mb-4 min-h-[50px] text-center"></h3>
            <div id="options-container" class="space-y-2.5 mb-6"></div>
            <div class="flex justify-between pt-3 border-t border-amber-900/50">
                <button id="prev-btn" onclick="prevQuestion()" class="hidden text-gray-300 text-sm font-medium px-4 py-2 rounded-lg border border-amber-900 transition bg-amber-950/50">ย้อนกลับ</button>
                <div class="ml-auto"><button id="next-btn" onclick="nextQuestion()" disabled class="bg-gray-800 text-gray-500 text-sm font-semibold py-2 px-6 rounded-lg cursor-not-allowed transition">ถัดไป</button></div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden text-center relative z-10">
            <div class="p-6 rounded-2xl bg-amber-950/60 border border-amber-400/40 mb-6 text-center shadow-lg">
                <div class="text-amber-300 text-sm mb-1 tracking-widest sparkle-1">✨ ── มหาสมุดแห่งโชคชะตา ── ✨</div>
                <h2 class="text-xl font-bold text-amber-200 mb-2">คำทำนายดวงชะตาการเงิน</h2>
                <div id="result-badge" class="text-sm font-semibold text-amber-300 mb-3 bg-amber-900/80 inline-block px-4 py-1 rounded-full border border-amber-400/40"></div>
                <p id="result-description" class="text-gray-200 text-xs md:text-sm leading-relaxed mb-4 text-center bg-black/40 p-4 rounded-xl border border-amber-900/40"></p>
                <div class="text-[10px] text-amber-300/60 tracking-widest sparkle-1">✦ ── Starry Night Destiny ── ✦</div>
            </div>
            <div class="flex justify-center">
                <button onclick="restartQuiz()" class="bg-amber-900/60 hover:bg-amber-800 text-gray-200 text-sm font-semibold py-3 px-8 rounded-xl transition border border-amber-700">ทำนายใหม่อีกครั้ง</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            { q: "ในช่วงนี้คุณรู้สึกว่าสภาพคล่องทางการเงินเป็นอย่างไร?", options: [{ text: "หมุนเงินคล่องตัว มีเงินเข้ามาเรื่อยๆ", points: 3 }, { text: "พอมีพอกิน ต้องวางแผนรัดเข็มขัด", points: 2 }, { text: "ตึงมือ มีภาระค่าใช้จ่ายรออยู่มาก", points: 1 }] },
            { q: "มุมมองของคุณต่อการลงทุนหรือการเสี่ยงโชคในช่วงนี้คือ?", options: [{ text: "พร้อมลุย มองหาโอกาสลงทุนใหม่ๆ", points: 3 }, { text: "ลงทุนแบบปลอดภัยและระมัดระวังตัว", points: 2 }, { text: "งดความเสี่ยง เก็บเงินสดไว้ก่อน", points: 1 }] },
            { q: "หากมีเงินก้อนโตเข้ามาในตอนนี้ คุณจะเลือกทำอะไรเป็นอันดับแรก?", options: [{ text: "นำไปต่อยอดลงทุนสร้างธุรกิจ", points: 3 }, { text: "แบ่งเก็บออมและซื้อของที่อยากได้", points: 2 }, { text: "เคลียร์หนี้สินและเก็บสำรองฉุกเฉิน", points: 1 }] },
            { q: "คุณมักจะเสียเงินกับเรื่องใดมากที่สุดในชีวิตประจำวัน?", options: [{ text: "การลงทุน การพัฒนาตนเอง หรืออุปกรณ์ทำงาน", points: 3 }, { text: "ค่าใช้จ่ายตามความสุขและความบันเทิง", points: 2 }, { text: "ค่าใช้จ่ายจำเป็นและภาระทางบ้าน", points: 1 }] },
            { q: "ความกังวลใจเรื่องเงินส่งผลกระทบต่อการนอนของคุณหรือไม่?", options: [{ text: "ไม่เลย วางใจและจัดการได้ดี", points: 3 }, { text: "มีคิดบ้างบางคืนเวลาใกล้จ่ายบิล", points: 2 }, { text: "กังวลจนนอนไม่หลับบ่อยครั้ง", points: 1 }] },
            { q: "คุณมีแผนการเก็บเงินระยะยาวที่ชัดเจนแค่ไหน?", options: [{ text: "มีเป้าหมายชัดเจนและทำตามแผนได้ดี", points: 3 }, { text: "มีเก็บออมบ้างแต่ยังไม่สม่ำเสมอ", points: 2 }, { text: "ยังไม่มีเงินเก็บเป็นชิ้นเป็นอัน", points: 1 }] },
            { q: "โอกาสในการได้เงินพิเศษหรือรายได้เสริมในช่วงนี้มีมากน้อยแค่ไหน?", options: [{ text: "มีช่องทางเข้ามาเรื่อยๆ จากความสามารถ", points: 3 }, { text: "พอมีลู่ทางแต่ต้องลงแรงเพิ่ม", points: 2 }, { text: "ค่อนข้างเงียบ มีรายทางเดียว", points: 1 }] },
            { q: "การยืมเงินหรือให้คนอื่นยืมเงินในช่วงนี้ส่งผลกับคุณไหม?", options: [{ text: "ไม่ยุ่งเกี่ยวกับเรื่องนี้ รักษากระเป๋าตัวเองดีที่สุด", points: 3 }, { text: "ระมัดระวังตัวมากขึ้น ให้ยืมเฉพาะคนสนิท", points: 2 }, { text: "เคยเดือดร้อนเพราะช่วยเหลือคนอื่นเรื่องเงิน", points: 1 }] },
            { q: "คุณให้ความสำคัญกับ 'การทำบุญเสริมดวงการเงิน' แค่ไหน?", options: [{ text: "ทำสม่ำเสมอและรู้สึกถึงพลังงานบุญกุศลได้ดี", points: 3 }, { text: "ทำตามโอกาสและความสะดวก", points: 2 }, { text: "ไม่ค่อยเน้น เน้นลงมือทำเองมากกว่า", points: 1 }] },
            { q: "ภาพรวมความมั่งคั่งของคุณในอนาคตอันใกล้ คุณมองเห็นอย่างไร?", options: [{ text: "มั่นคงขึ้นและมีโอกาสเติบโตสูง", points: 3 }, { text: "ทรงตัวประคับประคองไปได้", points: 2 }, { text: "ต้องอดทนฝ่าฟันอุปสรรคเรื่องเงินอีกพักใหญ่", points: 1 }] }
        ];
        let currentQuestion = 0; let userAnswers = new Array(questions.length).fill(null);
        function startQuiz() { document.getElementById('start-screen').classList.add('hidden'); document.getElementById('quiz-screen').classList.remove('hidden'); loadQuestion(); }
        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question-text').textContent = `${currentQuestion + 1}. ${q.q}`;
            document.getElementById('question-counter').textContent = `ข้อที่ ${currentQuestion + 1} / ${questions.length}`;
            document.getElementById('progress-bar').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
            const container = document.getElementById('options-container'); container.innerHTML = '';
            q.options.forEach((opt, index) => {
                const isSelected = userAnswers[currentQuestion] === index;
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border transition flex items-center justify-between text-sm item-box ${isSelected ? 'border-amber-400 bg-amber-900/80 text-amber-200 font-medium' : 'text-gray-200'}`;
                btn.innerHTML = `<span>${opt.text}</span><span class="w-5 h-5 rounded-full border flex items-center justify-center text-xs ${isSelected ? 'border-amber-300 bg-amber-500 text-gray-950 font-bold' : 'border-gray-600'}">${isSelected ? '✓' : ''}</span>`;
                btn.onclick = () => { userAnswers[currentQuestion] = index; loadQuestion(); };
                container.appendChild(btn);
            });
            document.getElementById('prev-btn').classList.toggle('hidden', currentQuestion === 0);
            const nextBtn = document.getElementById('next-btn');
            if (userAnswers[currentQuestion] !== null) {
                nextBtn.disabled = false; nextBtn.className = "bg-amber-500 hover:bg-amber-400 text-gray-950 text-sm font-bold py-2 px-6 rounded-lg shadow transition";
                nextBtn.textContent = currentQuestion === questions.length - 1 ? "เปิดคำทำนาย" : "ถัดไป";
            } else {
                nextBtn.disabled = true; nextBtn.className = "bg-gray-800 text-gray-500 text-sm font-semibold py-2 px-6 rounded-lg cursor-not-allowed transition";
            }
        }
        function nextQuestion() { if (currentQuestion < questions.length - 1) { currentQuestion++; loadQuestion(); } else { showResult(); } }
        function prevQuestion() { if (currentQuestion > 0) { currentQuestion--; loadQuestion(); } }
        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden'); document.getElementById('result-screen').classList.remove('hidden');
            const totalScore = userAnswers.reduce((sum, ansIdx, qIdx) => sum + (ansIdx !== null ? questions[qIdx].options[ansIdx].points : 0), 0);
            let title = totalScore >= 25 ? "💎 อภิมหาเศรษฐีผู้มีกระแสทรัพย์หลั่งไหล" : totalScore >= 18 ? "🪙 นักบริหารการเงินผู้มั่นคง" : "⚠️ ช่วงระมัดระวังกระแสเงินสด";
            let desc = totalScore >= 25 ? "ดวงการเงินพุ่ง ธุรกิจและการลงทุนให้ผลตอบแทนดีเยี่ยม มีเกณฑ์รับทรัพย์ก้อนโต" : totalScore >= 18 ? "การเงินอยู่ในเกณฑ์ราบรื่น บริหารจัดการหนี้สินและค่าใช้จ่ายได้ดี ไม่มีสะดุด" : "ช่วงนี้ควรระมัดระวังการใช้จ่ายเป็นพิเศษ หลีกเลี่ยงการลงทุนที่มีความเสี่ยงสูง";
            document.getElementById('result-badge').textContent = title; document.getElementById('result-description').innerHTML = desc;
        }
        function restartQuiz() { currentQuestion = 0; userAnswers = new Array(questions.length).fill(null); document.getElementById('result-screen').classList.add('hidden'); document.getElementById('start-screen').classList.remove('hidden'); }
    </script>
</body>
</html>
