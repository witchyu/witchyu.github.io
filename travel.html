<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <title>ทำนายดวงชะตา: การเดินทาง & การโยกย้าย</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .vangogh-card {
            background: radial-gradient(circle at 50% 30%, rgba(15, 65, 85, 0.9) 0%, rgba(5, 25, 35, 0.98) 70%, rgba(2, 12, 18, 1) 100%);
            border: 2px solid rgba(103, 232, 249, 0.6);
            box-shadow: 0 0 40px rgba(15, 110, 140, 0.4), inset 0 0 25px rgba(103, 232, 249, 0.2);
            position: relative;
            overflow: hidden;
        }
        .vangogh-card::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(ellipse at center, rgba(70, 170, 200, 0.15) 0%, transparent 60%),
                        repeating-radial-gradient(circle at 40% 40%, transparent, rgba(103, 232, 249, 0.05) 40px, transparent 80px);
            animation: swirlRotate 30s linear infinite;
            pointer-events: none;
        }
        @keyframes swirlRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .item-box {
            background: rgba(8, 35, 45, 0.7);
            border: 1px solid rgba(103, 232, 249, 0.4);
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .item-box:hover {
            background: rgba(15, 55, 70, 0.9);
            border-color: rgba(103, 232, 249, 1);
            box-shadow: 0 0 20px rgba(103, 232, 249, 0.4);
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 10px rgba(103, 232, 249, 0.9)); }
        }
        .sparkle-1 { animation: twinkle 4s infinite ease-in-out; }
    </style>
</head>
<body class="bg-black min-h-screen w-full m-0 p-4 text-gray-100 flex flex-col items-center justify-center relative bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-cyan-950 via-slate-950 to-black">
    
    <div class="max-w-xl w-full mb-3 flex justify-between items-center px-2">
        <a href="lindex.html" class="text-xs bg-cyan-950/60 hover:bg-cyan-900 text-cyan-200 px-3 py-1.5 rounded-lg border border-cyan-400/40 transition">← กลับหน้าหลัก</a>
        <span class="text-xs text-cyan-300 font-semibold"> การเดินทางและการโยกย้าย</span>
    </div>
    
    <div id="app" class="max-w-xl w-full vangogh-card rounded-[2.5rem] p-6 md:p-8 text-center relative z-10">
        <div class="text-cyan-300 text-lg mb-2 tracking-widest sparkle-1">✦ ✧ ☽️ ☾ ✧ ✦</div>

        <!-- Start Screen -->
        <div id="start-screen" class="py-4 relative z-10">
            <div class="text-4xl mb-4"></div>
            <h2 class="text-xl font-semibold text-cyan-200 mb-2">พยากรณ์การเดินทาง & การย้ายถิ่น</h2>
            <p class="text-cyan-200/80 mb-6 text-sm">ตรวจเช็กดวงการเดินทาง ทริปท่องเที่ยว และการโยกย้าย</p>
            <button onclick="startQuiz()" class="bg-gradient-to-r from-cyan-500 to-teal-600 hover:from-cyan-400 hover:to-teal-500 text-gray-950 font-bold py-3 px-8 rounded-full shadow-lg transition transform hover:scale-105">เริ่มทำนายการเดินทาง</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden text-left relative z-10">
            <div class="flex justify-between items-center mb-4 border-b border-cyan-900/50 pb-3">
                <span id="question-counter" class="text-xs font-semibold text-cyan-300 bg-cyan-950 px-3 py-1 rounded-full border border-cyan-400/40">ข้อที่ 1 / 10</span>
                <div class="w-1/2 bg-gray-900 rounded-full h-2 overflow-hidden">
                    <div id="progress-bar" class="bg-cyan-400 h-2 rounded-full transition-all duration-300" style="width: 10%"></div>
                </div>
            </div>
            <h3 id="question-text" class="text-base md:text-lg font-medium text-cyan-100 mb-4 min-h-[50px] text-center"></h3>
            <div id="options-container" class="space-y-2.5 mb-6"></div>
            <div class="flex justify-between pt-3 border-t border-cyan-900/50">
                <button id="prev-btn" onclick="prevQuestion()" class="hidden text-gray-300 text-sm font-medium px-4 py-2 rounded-lg border border-cyan-900 transition bg-cyan-950/50">ย้อนกลับ</button>
                <div class="ml-auto"><button id="next-btn" onclick="nextQuestion()" disabled class="bg-gray-800 text-gray-500 text-sm font-semibold py-2 px-6 rounded-lg cursor-not-allowed transition">ถัดไป</button></div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden text-center relative z-10">
            <div class="p-6 rounded-2xl bg-cyan-950/60 border border-cyan-400/40 mb-6 text-center shadow-lg">
                <div class="text-cyan-300 text-sm mb-1 tracking-widest sparkle-1">✨ ── มหาสมุดแห่งโชคชะตา ── ✨</div>
                <h2 class="text-xl font-bold text-cyan-200 mb-2">คำทำนายด้านการเดินทางของคุณ</h2>
                <div id="result-badge" class="text-sm font-semibold text-cyan-300 mb-3 bg-cyan-900/80 inline-block px-4 py-1 rounded-full border border-cyan-400/40"></div>
                <p id="result-description" class="text-gray-200 text-xs md:text-sm leading-relaxed mb-4 text-center bg-black/40 p-4 rounded-xl border border-cyan-900/40"></p>
                <div class="text-[10px] text-cyan-300/60 tracking-widest sparkle-1">✦ ── Starry Travel Destiny ── ✦</div>
            </div>
            <div class="flex justify-center">
                <button onclick="restartQuiz()" class="bg-cyan-900/60 hover:bg-cyan-800 text-gray-200 text-sm font-semibold py-3 px-8 rounded-xl transition border border-cyan-700">ทำนายใหม่อีกครั้ง</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            { q: "ช่วงนี้คุณมีโอกาสได้เดินทางไกลหรือเดินทางต่างจังหวัด/ต่างประเทศบ่อยแค่ไหน?", options: [{ text: "เดินทางบ่อย มีทริปต่อเนื่อง", points: 3 }, { text: "มีวางแผนไว้บ้างตามโอกาส", points: 2 }, { text: "เดินทางน้อย อยู่กับที่เป็นหลัก", points: 1 }] },
            { q: "ความพร้อมในการเตรียมตัวก่อนออกเดินทางของคุณเป็นอย่างไร?", options: [{ text: "วางแผนรัดกุม จองตั๋วที่พักเรียบร้อยสมบูรณ์", points: 3 }, { text: "เตรียมตัวพอประมาณ เน้นความยืดหยุ่น", points: 2 }, { text: "เดินทางแบบปุบปับกระทันหัน", points: 1 }] },
            { q: "คุณกังวลเรื่องอุบัติเหตุหรืออุปสรรคระหว่างเดินทางมากน้อยแค่ไหน?", options: [{ text: "มีความมั่นใจ ปลอดภัยไร้กังวล", points: 3 }, { text: "รอบคอบระมัดระวังตัวดี", points: 2 }, { text: "มีความกังวลใจเรื่องการเดินทางอยู่บ้าง", points: 1 }] },
            { q: "หากต้องเผชิญกับสถานการณ์เดินทางล่าช้า คุณรับมืออย่างไร?", options: [{ text: "ตั้งสติและปรับแผนหน้างานได้อย่างรวดเร็ว", points: 3 }, { text: "มีหงุดหงิดบ้างแต่ก็ผ่านไปได้", points: 2 }, { text: "เครียดและหงุดหงิดง่ายเมื่อตารางเวลาเปลี่ยน", points: 1 }] },
            { q: "ทริปการเดินทางของคุณมักจะพบเจอประสบการณ์ที่ดีหรือคนช่วยเหลือไหม?", options: [{ text: "เจอคนดีๆ และเรื่องประทับใจเสมอ", points: 3 }, { text: "ราบรื่นดีไม่มีปัญหาอะไรพิเศษ", points: 2 }, { text: "เคยเจออุปสรรคหรือความวุ่นวายระหว่างทาง", points: 1 }] },
            { q: "ความตั้งใจในการโยกย้ายที่อยู่หรือเปลี่ยนสภาพแวดล้อมใหม่ในช่วงนี้?", options: [{ text: "มีเกณฑ์โยกย้ายหรือเปลี่ยนถิ่นฐานที่เจริญขึ้น", points: 3 }, { text: "อยู่บ้านหลังเดิมหรือที่เดิมมั่นคงดี", points: 2 }, { text: "รู้สึกเบื่อหน่ายอยากย้ายแต่ยังไม่พร้อม", points: 1 }] },
            { q: "การเดินทางเพื่อการทำงานหรือติดต่อธุรกิจให้ผลลัพธ์ที่ดีไหม?", options: [{ text: "เดินทางไปเจรจาสำเร็จลุล่วงด้วยดี", points: 3 }, { text: "งานเดินหน้าปกติ พอได้ผลลัพธ์", points: 2 }, { text: "เหนื่อยกับการเดินทางแต่ผลงานไม่คุ้มค่า", points: 1 }] },
            { q: "คุณชอบการเดินทางแบบผจญภัยหรือการเดินทางพักผ่อนสะดวกสบาย?", options: [{ text: "ชอบลุยๆ ค้นหาประสบการณ์แปลกใหม่", points: 3 }, { text: "ผสมผสานทั้งเที่ยวสนุกและพักผ่อน", points: 2 }, { text: "เน้นพักผ่อนนอนโรงแรมสบายๆ เท่านั้น", points: 1 }] },
            { q: "การเดินทางคนเดียวหรือเดินทางกับเพื่อนฝูงให้พลังงานที่ดีกว่ากัน?", options: [{ text: "ชอบอิสระเดินทางคนเดียวค้นพบตัวเอง", points: 3 }, { text: "เดินทางกับเพื่อนหรือครอบครัวสนุกกว่า", points: 2 }, { text: "ไม่อยากเดินทางไกลกับใครวุ่นวาย", points: 1 }] },
            { q: "ภาพรวมดวงการเดินทางของคุณในรอบนี้มองเห็นทิศทางใด?", options: [{ text: "เดินทางราบรื่น ปลอดภัย รับโชคจากการเดินทาง", points: 3 }, { text: "การเดินทางทั่วไปปกติไม่มีเหตุร้าย", points: 2 }, { text: "ควรตรวจเช็กยานพาหนะและความปลอดภัยให้รอบคอบ", points: 1 }] }
        ];
        let currentQuestion = 0; let userAnswers = new Array(questions.length).fill(null);
        function startQuiz() { document.getElementById('start-screen').classList.add('hidden'); document.getElementById('quiz-screen').classList.remove('hidden'); loadQuestion(); }
        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question-text').textContent = `${currentQuestion + 1}. ${q.q}`;
            document.getElementById('question-counter').textContent = `ข้อที่ ${currentQuestion + 1} / ${questions.length}`;
            document.getElementById('progress-bar').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
            const container = document.getElementById('options-container'); container.innerHTML = '';
            q.options.forEach((opt, index) => {
                const isSelected = userAnswers[currentQuestion] === index;
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border transition flex items-center justify-between text-sm item-box ${isSelected ? 'border-cyan-400 bg-cyan-900/80 text-cyan-200 font-medium' : 'text-gray-200'}`;
                btn.innerHTML = `<span>${opt.text}</span><span class="w-5 h-5 rounded-full border flex items-center justify-center text-xs ${isSelected ? 'border-cyan-300 bg-cyan-500 text-gray-950 font-bold' : 'border-gray-600'}">${isSelected ? '✓' : ''}</span>`;
                btn.onclick = () => { userAnswers[currentQuestion] = index; loadQuestion(); };
                container.appendChild(btn);
            });
            document.getElementById('prev-btn').classList.toggle('hidden', currentQuestion === 0);
            const nextBtn = document.getElementById('next-btn');
            if (userAnswers[currentQuestion] !== null) {
                nextBtn.disabled = false; nextBtn.className = "bg-cyan-500 hover:bg-cyan-400 text-gray-950 text-sm font-bold py-2 px-6 rounded-lg shadow transition";
                nextBtn.textContent = currentQuestion === questions.length - 1 ? "เปิดคำทำนาย" : "ถัดไป";
            } else {
                nextBtn.disabled = true; nextBtn.className = "bg-gray-800 text-gray-500 text-sm font-semibold py-2 px-6 rounded-lg cursor-not-allowed transition";
            }
        }
        function nextQuestion() { if (currentQuestion < questions.length - 1) { currentQuestion++; loadQuestion(); } else { showResult(); } }
        function prevQuestion() { if (currentQuestion > 0) { currentQuestion--; loadQuestion(); } }
        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden'); document.getElementById('result-screen').classList.remove('hidden');
            const totalScore = userAnswers.reduce((sum, ansIdx, qIdx) => sum + (ansIdx !== null ? questions[qIdx].options[ansIdx].points : 0), 0);
            let title = totalScore >= 25 ? "✈️ นักเดินทางผู้ไร้ขีดจำกัด ปลอดภัยโชคดี" : totalScore >= 18 ? "🚗 การเดินทางราบรื่นปลอดภัยตามมาตรฐาน" : "⚠️ ช่วงต้องเพิ่มความระมัดระวังในการเดินทาง";
            let desc = totalScore >= 25 ? "ดวงการเดินทางโดดเด่นมาก ทริปราบรื่นปลอดภัย มีเกณฑ์รับประสบการณ์ใหม่ๆ ที่ยอดเยี่ยมจากการเดินทาง" : totalScore >= 18 ? "การเดินทางปกติ ไม่มีอุปสรรคใหญ่หลวง วางแผนรอบคอบเดินทางได้ราบรื่น" : "ช่วงนี้ควรตรวจเช็กความปลอดภัย ยานพาหนะ และวางแผนเผื่อเวลาเดินทางให้รอบคอบเป็นพิเศษ";
            document.getElementById('result-badge').textContent = title; document.getElementById('result-description').innerHTML = desc;
        }
        function restartQuiz() { currentQuestion = 0; userAnswers = new Array(questions.length).fill(null); document.getElementById('result-screen').classList.add('hidden'); document.getElementById('start-screen').classList.remove('hidden'); }
    </script>
</body>
</html>
