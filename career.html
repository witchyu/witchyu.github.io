<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <title>ทำนายดวงชะตา: การงาน & ธุรกิจ</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .vangogh-card {
            background: radial-gradient(circle at 50% 30%, rgba(30, 60, 110, 0.9) 0%, rgba(10, 25, 50, 0.98) 70%, rgba(5, 12, 25, 1) 100%);
            border: 2px solid rgba(147, 197, 253, 0.6);
            box-shadow: 0 0 40px rgba(30, 100, 180, 0.4), inset 0 0 25px rgba(147, 197, 253, 0.2);
            position: relative;
            overflow: hidden;
        }
        .vangogh-card::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(ellipse at center, rgba(100, 150, 220, 0.15) 0%, transparent 60%),
                        repeating-radial-gradient(circle at 40% 40%, transparent, rgba(147, 197, 253, 0.05) 40px, transparent 80px);
            animation: swirlRotate 30s linear infinite;
            pointer-events: none;
        }
        @keyframes swirlRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .item-box {
            background: rgba(15, 35, 65, 0.7);
            border: 1px solid rgba(147, 197, 253, 0.4);
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .item-box:hover {
            background: rgba(25, 55, 95, 0.9);
            border-color: rgba(147, 197, 253, 1);
            box-shadow: 0 0 20px rgba(147, 197, 253, 0.4);
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 10px rgba(147, 197, 253, 0.9)); }
        }
        .sparkle-1 { animation: twinkle 4s infinite ease-in-out; }
    </style>
</head>
<body class="bg-black min-h-screen w-full m-0 p-4 text-gray-100 flex flex-col items-center justify-center relative bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-blue-950 via-slate-950 to-black">
    
    <div class="max-w-xl w-full mb-3 flex justify-between items-center px-2">
        <a href="lindex.html" class="text-xs bg-blue-950/60 hover:bg-blue-900 text-blue-200 px-3 py-1.5 rounded-lg border border-blue-400/40 transition">← กลับหน้าหลัก</a>
        <span class="text-xs text-blue-300 font-semibold"> การงานและความก้าวหน้า</span>
    </div>
    
    <div id="app" class="max-w-xl w-full vangogh-card rounded-[2.5rem] p-6 md:p-8 text-center relative z-10">
        <div class="text-blue-300 text-lg mb-2 tracking-widest sparkle-1">✦ ✧ ☽  ☾ ✧ ✦</div>

        <!-- Start Screen -->
        <div id="start-screen" class="py-4 relative z-10">
            <div class="text-4xl mb-4"></div>
            <h2 class="text-xl font-semibold text-blue-200 mb-2">พยากรณ์เส้นทางอาชีพ</h2>
            <p class="text-blue-200/80 mb-6 text-sm">วิเคราะห์ความก้าวหน้า โปรเจกต์ และปัญหารอบตัว</p>
            <button onclick="startQuiz()" class="bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-400 hover:to-indigo-500 text-white font-bold py-3 px-8 rounded-full shadow-lg transition transform hover:scale-105">เริ่มทำนายการงาน</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden text-left relative z-10">
            <div class="flex justify-between items-center mb-4 border-b border-blue-900/50 pb-3">
                <span id="question-counter" class="text-xs font-semibold text-blue-300 bg-blue-950 px-3 py-1 rounded-full border border-blue-400/40">ข้อที่ 1 / 10</span>
                <div class="w-1/2 bg-gray-900 rounded-full h-2 overflow-hidden">
                    <div id="progress-bar" class="bg-blue-400 h-2 rounded-full transition-all duration-300" style="width: 10%"></div>
                </div>
            </div>
            <h3 id="question-text" class="text-base md:text-lg font-medium text-blue-100 mb-4 min-h-[50px] text-center"></h3>
            <div id="options-container" class="space-y-2.5 mb-6"></div>
            <div class="flex justify-between pt-3 border-t border-blue-900/50">
                <button id="prev-btn" onclick="prevQuestion()" class="hidden text-gray-300 text-sm font-medium px-4 py-2 rounded-lg border border-blue-900 transition bg-blue-950/50">ย้อนกลับ</button>
                <div class="ml-auto"><button id="next-btn" onclick="nextQuestion()" disabled class="bg-gray-800 text-gray-500 text-sm font-semibold py-2 px-6 rounded-lg cursor-not-allowed transition">ถัดไป</button></div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden text-center relative z-10">
            <div class="p-6 rounded-2xl bg-blue-950/60 border border-blue-400/40 mb-6 text-center shadow-lg">
                <div class="text-blue-300 text-sm mb-1 tracking-widest sparkle-1">✨ ── มหาสมุดแห่งโชคชะตา ── ✨</div>
                <h2 class="text-xl font-bold text-blue-200 mb-2">คำทำนายด้านการงานของคุณ</h2>
                <div id="result-badge" class="text-sm font-semibold text-blue-300 mb-3 bg-blue-900/80 inline-block px-4 py-1 rounded-full border border-blue-400/40"></div>
                <p id="result-description" class="text-gray-200 text-xs md:text-sm leading-relaxed mb-4 text-center bg-black/40 p-4 rounded-xl border border-blue-900/40"></p>
                <div class="text-[10px] text-blue-300/60 tracking-widest sparkle-1">✦ ── Starry Career Destiny ── ✦</div>
            </div>
            <div class="flex justify-center">
                <button onclick="restartQuiz()" class="bg-blue-900/60 hover:bg-blue-800 text-gray-200 text-sm font-semibold py-3 px-8 rounded-xl transition border border-blue-700">ทำนายใหม่อีกครั้ง</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            { q: "สถานการณ์งานปัจจุบันของคุณมีความกดดันหรือปัญหาจุกจิกมากแค่ไหน?", options: [{ text: "ราบรื่นดี งานเดินหน้าตามแผน", points: 3 }, { text: "มีอุปสรรคประปรายแต่รับมือได้", points: 2 }, { text: "กดดันสูง ปัญหาเยอะรอบด้าน", points: 1 }] },
            { q: "ความสัมพันธ์กับเพื่อนร่วมงานหรือหัวหน้างานในเวลานี้เป็นอย่างไร?", options: [{ text: "ยอดเยี่ยม ซัพพอร์ตกันดีมาก", points: 3 }, { text: "ต่างคนต่างทำงานร่วมกันได้ปกติ", points: 2 }, { text: "มีประเด็นขัดแย้งหรือสื่อสารกันไม่ค่อยเข้าใจ", points: 1 }] },
            { q: "คุณมีโอกาสได้แสดงผลงานชิ้นโบว์แดงหรือเลื่อนขั้นปรับตำแหน่งไหม?", options: [{ text: "มีเกณฑ์โดดเด่น ผู้ใหญ่เห็นผลงานชัดเจน", points: 3 }, { text: "ทำหน้าที่ไปตามปกติ ยังไม่มีการเปลี่ยนแปลง", points: 2 }, { text: "เหนื่อยฟรี ผลงานไม่ค่อยถูกมองเห็น", points: 1 }] },
            { q: "ความคิดเรื่องการลาออก ย้ายงาน หรือเปลี่ยนสายอาชีพแวบเข้ามาบ่อยแค่ไหน?", options: [{ text: "ไม่คิดเลย สนุกกับงานที่ทำอยู่", points: 3 }, { text: "คิดเป็นบางครั้งตามอารมณ์ชั่ววูบ", points: 2 }, { text: "คิดจริงจังและกำลังมองหาโอกาสใหม่", points: 1 }] },
            { q: "โปรเจกต์หรือภาระงานที่ได้รับมอบหมายในช่วงนี้สำเร็จลุล่วงด้วยดีไหม?", options: [{ text: "สำเร็จเกินคาด ได้รับคำชม", points: 3 }, { text: "เสร็จตามกำหนดเวลาทั่วไป", points: 2 }, { text: "ติดขัด ล่าช้า หรือต้องแก้หลายรอบ", points: 1 }] },
            { q: "ไฟในการทำงานหรือแพสชันของคุณตอนนี้อยู่ในระดับใด?", options: [{ text: "ลุกโชน พร้อมสร้างสรรค์สิ่งใหม่ๆ", points: 3 }, { text: "ทรงตัว ทำตามหน้าที่ไปวันๆ", points: 2 }, { text: "หมดไฟ อ่อนล้าทางจิตใจ", points: 1 }] },
            { q: "การแข่งขันชิงดีชิงเด่นในที่ทำงานส่งผลกระทบต่อคุณหรือไม่?", options: [{ text: "ไม่สนใจ โฟกัสที่งานตัวเองอย่างเดียว", points: 3 }, { text: "รับรู้บ้างแต่หลีกเลี่ยงปัญหาได้", points: 2 }, { text: "ได้รับผลกระทบโดยตรงจากเกมการเมืองในองค์กร", points: 1 }] },
            { q: "ไอเดียและความคิดสร้างสรรค์ของคุณพรั่งพรูดีไหมในตอนนี้?", options: [{ text: "ไอเดียพุ่งกระฉูด เสนออะไรก็ผ่าน", points: 3 }, { text: "คิดงานออกเรื่อยๆ ตามโจทย์", points: 2 }, { text: "สมองตื้อ คิดอะไรไม่ออก", points: 1 }] },
            { q: "ความสมดุลระหว่างเวลางานและเวลาส่วนตัว (Work-Life Balance) เป็นอย่างไร?", options: [{ text: "สมดุลดี มีเวลาพักผ่อนเต็มที่", points: 3 }, { text: "มีเอาน้ำหนักไปเรื่องงานบ้างบางวัน", points: 2 }, { text: "งานทับถมจนไม่มีเวลาส่วนตัว", points: 1 }] },
            { q: "ภาพรวมอนาคตในสายอาชีพของคุณอีก 3 เดือนข้างหน้ามองเห็นอะไร?", options: [{ text: "ความก้าวหน้าและการเติบโตครั้งใหญ่", points: 3 }, { text: "ความมั่นคงคงเดิมในจุดที่เป็นอยู่", points: 2 }, { text: "ความไม่แน่นอนที่ต้องเตรียมรับมือ", points: 1 }] }
        ];
        let currentQuestion = 0; let userAnswers = new Array(questions.length).fill(null);
        function startQuiz() { document.getElementById('start-screen').classList.add('hidden'); document.getElementById('quiz-screen').classList.remove('hidden'); loadQuestion(); }
        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question-text').textContent = `${currentQuestion + 1}. ${q.q}`;
            document.getElementById('question-counter').textContent = `ข้อที่ ${currentQuestion + 1} / ${questions.length}`;
            document.getElementById('progress-bar').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
            const container = document.getElementById('options-container'); container.innerHTML = '';
            q.options.forEach((opt, index) => {
                const isSelected = userAnswers[currentQuestion] === index;
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border transition flex items-center justify-between text-sm item-box ${isSelected ? 'border-blue-400 bg-blue-900/80 text-blue-200 font-medium' : 'text-gray-200'}`;
                btn.innerHTML = `<span>${opt.text}</span><span class="w-5 h-5 rounded-full border flex items-center justify-center text-xs ${isSelected ? 'border-blue-300 bg-blue-500 text-white font-bold' : 'border-gray-600'}">${isSelected ? '✓' : ''}</span>`;
                btn.onclick = () => { userAnswers[currentQuestion] = index; loadQuestion(); };
                container.appendChild(btn);
            });
            document.getElementById('prev-btn').classList.toggle('hidden', currentQuestion === 0);
            const nextBtn = document.getElementById('next-btn');
            if (userAnswers[currentQuestion] !== null) {
                nextBtn.disabled = false; nextBtn.className = "bg-blue-500 hover:bg-blue-400 text-white text-sm font-bold py-2 px-6 rounded-lg shadow transition";
                nextBtn.textContent = currentQuestion === questions.length - 1 ? "เปิดคำทำนาย" : "ถัดไป";
            } else {
                nextBtn.disabled = true; nextBtn.className = "bg-gray-800 text-gray-500 text-sm font-semibold py-2 px-6 rounded-lg cursor-not-allowed transition";
            }
        }
        function nextQuestion() { if (currentQuestion < questions.length - 1) { currentQuestion++; loadQuestion(); } else { showResult(); } }
        function prevQuestion() { if (currentQuestion > 0) { currentQuestion--; loadQuestion(); } }
        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden'); document.getElementById('result-screen').classList.remove('hidden');
            const totalScore = userAnswers.reduce((sum, ansIdx, qIdx) => sum + (ansIdx !== null ? questions[qIdx].options[ansIdx].points : 0), 0);
            let title = totalScore >= 25 ? "🏆 ผู้นำแห่งความสำเร็จและความก้าวหน้า" : totalScore >= 18 ? "📈 คนทำงานมืออาชีพผู้มั่นคง" : "⚠️ ช่วงฝ่าฟันอุปสรรคและประคับประคอง";
            let desc = totalScore >= 25 ? "ดวงการงานโดดเด่นมาก มีเกณฑ์ได้รับความไว้วางใจ เลื่อนขั้น หรือทำโปรเจกต์ใหญ่สำเร็จ" : totalScore >= 18 ? "การงานราบรื่นดี ทำงานตามเป้าหมายได้ตามมาตรฐาน ร่วมมือกับคนรอบข้างได้ดี" : "อาจพบเจอปัญหาจุกจิกหรือความกดดันสูง ควรตั้งสติและบริหารเวลาให้ดี";
            document.getElementById('result-badge').textContent = title; document.getElementById('result-description').innerHTML = desc;
        }
        function restartQuiz() { currentQuestion = 0; userAnswers = new Array(questions.length).fill(null); document.getElementById('result-screen').classList.add('hidden'); document.getElementById('start-screen').classList.remove('hidden'); }
    </script>
</body>
</html>
